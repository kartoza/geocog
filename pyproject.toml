[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geocog"
version = "0.1.0"
description = "A small, fast TUI and toolkit for the GeoTIFF → COG → object-storage → GeoServer VRT workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kartoza (Pty) Ltd", email = "info@kartoza.com" }]
maintainers = [{ name = "Kartoza (Pty) Ltd", email = "info@kartoza.com" }]
keywords = ["cog", "gdal", "vrt", "minio", "s3", "geoserver", "tui", "textual", "gis", "raster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Utilities",
]
dependencies = [
  "textual>=0.80",
  "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/kartoza/geocog"
Documentation = "https://kartoza.github.io/geocog/"
Repository = "https://github.com/kartoza/geocog"
Issues = "https://github.com/kartoza/geocog/issues"
Changelog = "https://github.com/kartoza/geocog/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/kartoza"

[project.scripts]
geocog = "geocog.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-with-pdf>=0.9",
  "pymdown-extensions>=10",
]
package = [
  "build>=1",
  "pyinstaller>=6",
  "cyclonedx-bom>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geocog = ["*.tcss", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["geocog"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
