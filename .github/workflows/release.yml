# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # ── Python wheel + sdist ─────────────────────────────────
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Standalone binaries via PyInstaller ──────────────────
  build-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: geocog-linux-amd64
            binary: dist/geocog
          - os: macos-latest
            artifact: geocog-macos-amd64
            binary: dist/geocog
          - os: macos-14
            artifact: geocog-macos-arm64
            binary: dist/geocog
          - os: windows-latest
            artifact: geocog-windows-amd64.exe
            binary: dist/geocog.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller
      - name: Build standalone binary
        run: |
          pyinstaller --onefile \
            --name geocog \
            --collect-all textual \
            --add-data "src/geocog/app.tcss:geocog" \
            --add-data "src/geocog/i18n:geocog/i18n" \
            src/geocog/__main__.py
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # ── Debian .deb package ──────────────────────────────────
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[dev]" pyinstaller
          sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name geocog \
            --collect-all textual \
            --add-data "src/geocog/app.tcss:geocog" \
            --add-data "src/geocog/i18n:geocog/i18n" \
            src/geocog/__main__.py
      - name: Package as .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          cp dist/geocog pkg/usr/local/bin/geocog
          chmod 755 pkg/usr/local/bin/geocog
          cat > pkg/DEBIAN/control << EOF
          Package: geocog
          Version: ${VERSION}
          Section: science
          Priority: optional
          Architecture: amd64
          Depends: gdal-bin
          Recommends: minio-client
          Maintainer: Kartoza (Pty) Ltd <info@kartoza.com>
          Description: TUI + toolkit for the GeoTIFF -> COG -> object storage -> VRT workflow
           A small, fast, keyboard-driven terminal UI (and matching CLI tools) that
           turns GeoTIFFs into Cloud Optimized GeoTIFFs, uploads them to S3/MinIO,
           and wraps them in a GeoServer-ready GDAL VRT. Requires GDAL at runtime.
          Homepage: https://github.com/kartoza/geocog
          EOF
          dpkg-deb --build pkg geocog_${VERSION}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-deb
          path: "*.deb"

  # ── RPM package ──────────────────────────────────────────
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[dev]" pyinstaller
          sudo apt-get update && sudo apt-get install -y rpm
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name geocog \
            --collect-all textual \
            --add-data "src/geocog/app.tcss:geocog" \
            --add-data "src/geocog/i18n:geocog/i18n" \
            src/geocog/__main__.py
      - name: Package as .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpmbuild/BUILDROOT/geocog-${VERSION}-1.x86_64/usr/local/bin
          cp dist/geocog rpmbuild/BUILDROOT/geocog-${VERSION}-1.x86_64/usr/local/bin/
          chmod 755 rpmbuild/BUILDROOT/geocog-${VERSION}-1.x86_64/usr/local/bin/geocog
          cat > rpmbuild/SPECS/geocog.spec << EOF
          Name: geocog
          Version: ${VERSION}
          Release: 1
          Summary: TUI + toolkit for the GeoTIFF -> COG -> object storage -> VRT workflow
          License: MIT
          URL: https://github.com/kartoza/geocog
          Group: Applications/Science
          Requires: gdal

          %description
          A small, fast, keyboard-driven terminal UI and matching CLI tools that turn
          GeoTIFFs into Cloud Optimized GeoTIFFs, upload them to S3/MinIO, and wrap
          them in a GeoServer-ready GDAL VRT.

          %files
          /usr/local/bin/geocog
          EOF
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/geocog.spec
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-rpm
          path: rpmbuild/RPMS/**/*.rpm

  # ── AppImage ─────────────────────────────────────────────
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[dev]" pyinstaller
          sudo apt-get update && sudo apt-get install -y imagemagick
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-extracted
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name geocog \
            --collect-all textual \
            --add-data "src/geocog/app.tcss:geocog" \
            --add-data "src/geocog/i18n:geocog/i18n" \
            src/geocog/__main__.py
      - name: Package as AppImage
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p GeoCog.AppDir/usr/bin
          cp dist/geocog GeoCog.AppDir/usr/bin/
          chmod 755 GeoCog.AppDir/usr/bin/geocog

          cat > GeoCog.AppDir/AppRun << 'APPRUN'
          #!/usr/bin/env bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "${HERE}/usr/bin/geocog" "$@"
          APPRUN
          chmod +x GeoCog.AppDir/AppRun

          cat > GeoCog.AppDir/geocog.desktop << EOF
          [Desktop Entry]
          Name=geocog
          Exec=geocog
          Icon=geocog
          Type=Application
          Categories=Science;Geography;
          Comment=TUI for the GeoTIFF -> COG -> object storage -> VRT workflow
          Terminal=true
          EOF

          cp resources/geocog.png GeoCog.AppDir/geocog.png 2>/dev/null || \
            convert -size 256x256 xc:'#0d1b2a' GeoCog.AppDir/geocog.png 2>/dev/null || \
            touch GeoCog.AppDir/geocog.png

          ARCH=x86_64 ./appimagetool-extracted/AppRun GeoCog.AppDir \
            geocog-${VERSION}-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-appimage
          path: "*.AppImage"

  # ── Snap package ─────────────────────────────────────────
  build-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-snap
          path: ${{ steps.build.outputs.snap }}

  # ── macOS .dmg installers (Intel + Apple Silicon) ────────
  build-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: amd64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      # All optional — unset secrets make the related steps skip cleanly.
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller
      - name: Build standalone binary
        run: |
          pyinstaller --onefile \
            --name geocog \
            --collect-all textual \
            --add-data "src/geocog/app.tcss:geocog" \
            --add-data "src/geocog/i18n:geocog/i18n" \
            src/geocog/__main__.py
      - name: Import signing certificate into a temporary keychain
        if: ${{ env.MACOS_CERT_BASE64 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/geocog-signing.keychain-db"
          KCPASS="ci-$RANDOM-$RANDOM"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          # Make our keychain the default + first in the search list.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          rm -f "$CERT"
          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Sign binary (only if a signing identity is configured)
        if: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "${MACOS_SIGN_IDENTITY}" dist/geocog
          codesign --verify --strict --verbose=2 dist/geocog
      - name: Note when unsigned
        if: ${{ env.MACOS_SIGN_IDENTITY == '' }}
        run: echo "No MACOS_SIGN_IDENTITY secret — shipping an unsigned binary."
      - name: Assemble .dmg
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          STAGE="dmg-root"
          mkdir -p "$STAGE"
          cp dist/geocog "$STAGE/geocog"
          chmod 755 "$STAGE/geocog"
          cp packaging/macos/install.command "$STAGE/install.command"
          chmod 755 "$STAGE/install.command"
          cp packaging/macos/README.txt "$STAGE/README.txt"
          hdiutil create -volname "geocog ${VERSION}" \
            -srcfolder "$STAGE" -ov -format UDZO \
            "geocog-${VERSION}-macos-${{ matrix.arch }}.dmg"
      - name: Sign the .dmg (only if a signing identity is configured)
        if: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        run: |
          codesign --force --timestamp --sign "${MACOS_SIGN_IDENTITY}" \
            geocog-*-macos-${{ matrix.arch }}.dmg
      - name: Notarize & staple (only if notary credentials are configured)
        if: ${{ env.MACOS_NOTARY_APPLE_ID != '' }}
        run: |
          DMG=$(ls geocog-*-macos-${{ matrix.arch }}.dmg)
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-dmg-${{ matrix.arch }}
          path: "*.dmg"

  # ── Windows .msi installer (WiX) ─────────────────────────
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller
      - name: Build standalone binary
        run: |
          pyinstaller --onefile `
            --name geocog `
            --collect-all textual `
            --icon packaging/windows/geocog.ico `
            --add-data "src/geocog/app.tcss;geocog" `
            --add-data "src/geocog/i18n;geocog/i18n" `
            src/geocog/__main__.py
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build MSI
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          wix build packaging/windows/geocog.wxs \
            -d Version="${VERSION}" \
            -d BinPath="dist/geocog.exe" \
            -o "geocog-${VERSION}-amd64.msi"
      - name: Sign MSI (optional — only if a code-signing cert is configured)
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "${WINDOWS_CERT_BASE64}" ]; then
            echo "${WINDOWS_CERT_BASE64}" | base64 -d > cert.pfx
            signtool sign //f cert.pfx //p "${WINDOWS_CERT_PASSWORD}" \
              //tr http://timestamp.digicert.com //td sha256 //fd sha256 \
              geocog-*-amd64.msi
            rm -f cert.pfx
          else
            echo "No WINDOWS_CERT_BASE64 secret — shipping an unsigned MSI."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-msi
          path: "*.msi"

  # ── Documentation PDF ────────────────────────────────────
  build-docs-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev fonts-inter
      - name: Install docs toolchain
        run: pip install ".[docs]"
      - name: Build docs PDF
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdocs build --strict -f mkdocs.pdf.yml
          cp site/pdf/geocog.pdf geocog-${VERSION}-docs.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-docs-pdf
          path: "*.pdf"

  # ── SBOM for release ─────────────────────────────────────
  release-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o geocog-sbom.json --output-format JSON
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-sbom
          path: geocog-sbom.json

  # ── Publish to PyPI (enable once a trusted publisher exists) ──
  # publish-pypi:
  #   needs: build-python
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: python-dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release with all artifacts ────────────────────
  github-release:
    needs:
      - build-python
      - build-binary
      - build-deb
      - build-rpm
      - build-appimage
      - build-snap
      - build-dmg
      - build-msi
      - build-docs-pdf
      - release-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: List artifacts
        run: find artifacts/ -type f | sort
      - name: Generate release body
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat > release-body.md << 'EOF'
          ## geocog VERSION

          A small, fast TUI and toolkit for the **GeoTIFF → COG → object storage →
          GeoServer VRT** workflow. Made with 💗 by [Kartoza](https://kartoza.com).

          > ℹ️ **Runtime dependencies:** the standalone binaries and OS packages
          > bundle Python + Textual, but **GDAL** (and, for uploads, the MinIO
          > client `mc`) must be available on your `PATH`. The fully self-contained
          > option is `nix run github:kartoza/geocog#geocog`.

          ### Installation

          #### Package managers (managed install + auto-update)

          ```bash
          winget install Kartoza.geocog          # Windows
          choco install geocog                    # Windows (Chocolatey)
          brew install --cask kartoza/geocog/geocog   # macOS
          nix run github:kartoza/geocog#geocog    # any (self-contained)
          ```

          #### Linux

          | Format | File | Install |
          |--------|------|---------|
          | **AppImage** | `geocog-VERSION-x86_64.AppImage` | `chmod +x geocog-*.AppImage && ./geocog-*.AppImage` |
          | **Debian/Ubuntu** | `geocog_VERSION_amd64.deb` | `sudo apt install ./geocog_*.deb` |
          | **Fedora/RHEL** | `geocog-VERSION-1.x86_64.rpm` | `sudo rpm -i geocog-*.rpm` |
          | **Snap** | `geocog_VERSION_amd64.snap` | `sudo snap install --dangerous geocog_*.snap` |
          | **Standalone** | `geocog-linux-amd64` | `chmod +x geocog-linux-amd64 && sudo cp geocog-linux-amd64 /usr/local/bin/geocog` |

          #### macOS

          | Architecture | Installer (recommended) | Bare binary |
          |-------------|-------------------------|-------------|
          | **Intel (x86_64)** | `geocog-VERSION-macos-amd64.dmg` | `geocog-macos-amd64` |
          | **Apple Silicon (M1/M2/M3)** | `geocog-VERSION-macos-arm64.dmg` | `geocog-macos-arm64` |

          Open the `.dmg` and double-click **install.command** (installs to
          `/usr/local/bin`). Or install a bare binary manually:

          ```bash
          chmod +x geocog-macos-*
          sudo cp geocog-macos-* /usr/local/bin/geocog
          ```

          > **Gatekeeper (unsigned):** `xattr -d com.apple.quarantine /usr/local/bin/geocog` or allow in System Settings → Privacy & Security.

          #### Windows

          | Installer (recommended) | Bare binary |
          |-------------------------|-------------|
          | `geocog-VERSION-amd64.msi` | `geocog-windows-amd64.exe` |

          Run the **MSI** to install geocog to `Program Files` and add it to your
          `PATH`. Or download the bare `.exe` and place it on your `PATH`.
          > **SmartScreen (unsigned):** click "More info" → "Run anyway" on first launch.

          #### Python (pip)

          ```bash
          pipx install geocog   # or: pip install geocog
          ```

          ### Other downloads

          | File | Description |
          |------|-------------|
          | `geocog-VERSION.tar.gz` | Source distribution |
          | `geocog-VERSION-py3-none-any.whl` | Python wheel |
          | `geocog-VERSION-docs.pdf` | Documentation (combined PDF) |
          | `geocog-sbom.json` | Software Bill of Materials (CycloneDX JSON) |

          > **Unsigned packages:** .deb/.rpm/.snap are not signed with a distribution
          > key. For .snap use `--dangerous`; for .rpm with GPG checking use
          > `sudo rpm -i --nosignature geocog-*.rpm`.

          ---

          **[Documentation](https://kartoza.github.io/geocog)** · **[Source](https://github.com/kartoza/geocog)** · **[Sponsor](https://github.com/sponsors/kartoza)**

          Made with 💗 by [Kartoza](https://kartoza.com)
          EOF
          sed -i "s/VERSION/${VERSION}/g" release-body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            artifacts/python-dist/*
            artifacts/geocog-linux-amd64/*
            artifacts/geocog-macos-amd64/*
            artifacts/geocog-macos-arm64/*
            artifacts/geocog-windows-amd64.exe/*
            artifacts/geocog-dmg-amd64/*
            artifacts/geocog-dmg-arm64/*
            artifacts/geocog-msi/*
            artifacts/geocog-deb/*
            artifacts/geocog-rpm/**/*
            artifacts/geocog-appimage/*
            artifacts/geocog-snap/*
            artifacts/geocog-docs-pdf/*
            artifacts/geocog-sbom/*

  # ── Chocolatey package (Windows) ─────────────────────────
  # Builds the .nupkg from the released MSI and (if CHOCO_API_KEY is set) pushes
  # it to the Chocolatey community repository: `choco install geocog`.
  publish-chocolatey:
    needs: github-release
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Render package (inject version, MSI url + checksum)
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MSI="geocog-${VERSION}-amd64.msi"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${MSI}"
          curl -fsSL "$URL" -o "$MSI"
          SHA=$(sha256sum "$MSI" | cut -d' ' -f1)
          cd packaging/chocolatey
          sed -i "s/__VERSION__/${VERSION}/g" geocog.nuspec
          sed -i "s|__URL64__|${URL}|g;  s/__CHECKSUM64__/${SHA}/g" tools/chocolateyInstall.ps1
          cp ../../LICENSE tools/LICENSE.txt
      - name: choco pack
        shell: pwsh
        run: cd packaging/chocolatey; choco pack
      - uses: actions/upload-artifact@v4
        with:
          name: geocog-chocolatey
          path: packaging/chocolatey/*.nupkg
      - name: choco push (only if CHOCO_API_KEY is configured)
        if: ${{ env.CHOCO_API_KEY != '' }}
        shell: pwsh
        run: |
          cd packaging/chocolatey
          choco apikey --key $env:CHOCO_API_KEY --source https://push.chocolatey.org/
          choco push (Get-ChildItem *.nupkg | Select-Object -First 1).Name --source https://push.chocolatey.org/

  # ── winget submission (Windows Package Manager) ──────────
  # Submits a manifest PR to microsoft/winget-pkgs via wingetcreate.
  # Requires WINGET_TOKEN (a PAT that can push to your winget-pkgs fork).
  # First-ever submission must be seeded once with `wingetcreate new`.
  publish-winget:
    needs: github-release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          $Msi = "geocog-$Version-amd64.msi"
          $Url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$Msi"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Kartoza.geocog `
            --version $Version --urls "$Url" `
            --submit --token $env:WINGET_TOKEN

  # ── Homebrew cask (macOS) ────────────────────────────────
  # Renders the cask from the released DMGs and pushes it to the tap
  # `kartoza/homebrew-geocog`: `brew install --cask kartoza/geocog/geocog`.
  # Requires HOMEBREW_TAP_TOKEN (a PAT that can push to the tap repo).
  publish-homebrew-cask:
    needs: github-release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Render cask + push to tap (only if HOMEBREW_TAP_TOKEN is configured)
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          curl -fsSL "${base}/geocog-${VERSION}-macos-arm64.dmg"  -o arm64.dmg
          curl -fsSL "${base}/geocog-${VERSION}-macos-amd64.dmg"  -o amd64.dmg
          SHA_ARM=$(sha256sum arm64.dmg | cut -d' ' -f1)
          SHA_AMD=$(sha256sum amd64.dmg | cut -d' ' -f1)
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256_ARM64__/${SHA_ARM}/g" \
              -e "s/__SHA256_AMD64__/${SHA_AMD}/g" \
              packaging/homebrew/geocog.rb > geocog.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kartoza/homebrew-geocog.git" tap
          mkdir -p tap/Casks
          cp geocog.rb tap/Casks/geocog.rb
          cd tap
          git config user.name "kartoza-bot"
          git config user.email "info@kartoza.com"
          git add Casks/geocog.rb
          git commit -m "geocog ${VERSION}" || echo "no changes"
          git push
