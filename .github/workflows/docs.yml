name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeasyPrint (used by mkdocs-with-pdf) needs these native libraries.
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev fonts-inter

      - name: Install docs toolchain
        run: pip install ".[docs]"

      - name: Build site (HTML + combined PDF)
        run: mkdocs build --strict -f mkdocs.pdf.yml

      - name: Verify PDF was produced
        run: |
          test -f site/pdf/geocog.pdf
          echo "PDF OK ($(du -h site/pdf/geocog.pdf | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: geocog-docs-pdf
          path: site/pdf/geocog.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
