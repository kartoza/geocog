name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build + test in the Nix sandbox (authoritative) ──────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build geocog (runs the test suite in-sandbox)
        run: nix build .#geocog -L
      - name: Build docs (strict)
        run: nix develop --command mkdocs build --strict

  # ── Lint / format / licence / secrets ────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Ruff (lint + format check)
        run: |
          nix develop --command ruff check .
          nix develop --command ruff format --check .
      - name: REUSE / SPDX licence lint
        run: nix develop --command reuse lint
      - name: Secret scan (gitleaks)
        run: nix develop --command gitleaks detect --no-banner --redact --source .
